<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Portal Web</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 { color: #38bdf8; margin-bottom: 8px; }
    p { color: #94a3b8; text-align: center; max-width: 500px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      width: 100%;
      max-width: 800px;
      margin-top: 24px;
    }
    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #334155;
      text-align: center;
      transition: transform 0.2s;
    }
    .card:hover { transform: translateY(-4px); }
    .card a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: bold;
      display: inline-block;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h1>Mi Proyecto Web</h1>
  <p>Bienvenido a mi portal personal de proyectos y herramientas web.</p>

  <div class="grid">
    <div class="card">
      <h3>Proyecto 1</h3>
      <p>Descripción rápida de lo que hace esta herramienta.</p>
      <a href="#" target="_blank">Abrir</a>
    </div>
    <div class="card">
      <h3>Proyecto 2</h3>
      <p>Otra aplicación o sitio que quieras mostrar.</p>
      <a href="#" target="_blank">Abrir</a>
    </div>
  </div>

</body>
</html>
